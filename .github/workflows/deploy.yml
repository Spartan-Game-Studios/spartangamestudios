name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without an empty commit.
  workflow_dispatch:

# Read the repo, mint the Pages token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled —
# a half-uploaded artifact is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site is not published unless it is green. Same gate as CI, run
      # again here so a deploy can never outrun a failing check.
      - name: Check
        run: pnpm run check

      - name: Build
        env:
          VITE_NAKAMA_URL: ${{ vars.VITE_NAKAMA_URL }}
          VITE_NAKAMA_SERVER_KEY: ${{ vars.VITE_NAKAMA_SERVER_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ITCH_CLIENT_ID: ${{ vars.VITE_ITCH_CLIENT_ID }}
        run: pnpm run build

      - name: Verify the SPA fallback and custom domain survived the build
        run: |
          test -f dist/404.html || { echo "::error::dist/404.html missing — deep links would 404"; exit 1; }
          test -f dist/CNAME   || { echo "::error::dist/CNAME missing — the custom domain would be cleared"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml missing"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
